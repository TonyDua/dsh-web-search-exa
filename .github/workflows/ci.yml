name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.19.0 is the harness's declared floor; 24 is the current LTS line the
        # maintainer runs. Add the next even-numbered major here when it ships.
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (builds first, then runs node:test against lib/)
        run: pnpm test

      # The bundle is committed, so a source edit that forgets to rebuild would
      # ship stale behavior. Fail instead of publishing drift.
      - name: Fail when the committed lib/ is stale
        run: |
          if ! git diff --quiet -- lib; then
            echo "::error::lib/ is out of date — run 'pnpm run build' and commit the result."
            git --no-pager diff --stat -- lib
            exit 1
          fi

      - name: Check the publishable tarball
        run: npm pack --dry-run
