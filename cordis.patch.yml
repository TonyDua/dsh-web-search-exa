# The dsh-web-search-exa bundle patch.
#
# Inserts the zero-config Exa search provider into the profile and selects it
# as the web seam's active search provider. The row's `config` replaces the
# targeted row's whole config (patch semantics: last write wins per row), so
# users who customize `web` in their own profile cordis.patch.yml keep the
# last word — their patch applies after bundle patches.
- insert:
    - id: web-search-exa
      name: '@tonydua/dsh-web-search-exa'
      config:
        apiKeyEnv: EXA_API_KEY
        # providerId: exa-anon  # uncomment to coexist with the official package

    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        searchProvider: exa
